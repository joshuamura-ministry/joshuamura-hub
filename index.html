<title>Joshua Mura — Seek, and Ye Shall Find</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,540;0,9..144,640;1,9..144,340&family=Source+Sans+3:wght@400;600;700&display=swap');
:root{
  --walnut:#1d1510; --card:#2e2218; --card2:#382a1d;
  --ivory:#f4ede0; --dim:#c9bca8; --gold:#c9a24b; --gold-dk:#8a6c2c;
  --blue:#5b8fd9; --green:#7fbf8a; --red:#c25b4a; --parch:#e8dcc0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--walnut);color:var(--ivory);font-family:'Source Sans 3',system-ui,sans-serif;
  font-size:clamp(16px,1.3vw,20px);line-height:1.6;min-height:100dvh}
.glassbar{height:5px;background:linear-gradient(90deg,#27408b,#5b8fd9 18%,#5f9e6e 38%,#e0c068 55%,#c9722e 75%,#c25b4a)}
.wrap{max-width:880px;margin:0 auto;padding:clamp(18px,4vw,48px) clamp(16px,4vw,40px) 90px}
h1{font-family:'Fraunces',serif;font-weight:640;font-size:clamp(2rem,6vw,3.6rem);line-height:1.1}
h2{font-family:'Fraunces',serif;font-weight:540;font-size:clamp(1.5rem,4.5vw,2.4rem);line-height:1.15;margin-bottom:.4em}
.eyebrow{font-size:.72em;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:.7em}
.sub{color:var(--dim)}
a{color:var(--blue)}
.btn{display:inline-block;background:var(--gold);color:#241a0d;border:none;border-radius:12px;
  font-family:inherit;font-size:1rem;font-weight:700;padding:.7em 1.4em;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--ivory);border:1px solid rgba(244,237,224,.25)}
.btn:active{transform:scale(.97)}
.verse{border-left:3px solid var(--gold);padding:.5em 0 .5em 1em;margin:1em 0}
.verse p{font-family:'Fraunces',serif;font-style:italic;font-size:1.12em;color:var(--ivory)}
.verse cite{display:block;margin-top:.4em;font-size:.7em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-style:normal}
input[type=text],input[type=email],textarea,select{width:100%;background:var(--card);border:1.5px solid rgba(244,237,224,.25);
  border-radius:10px;color:var(--ivory);font-family:inherit;font-size:1em;padding:.6em .8em;margin:.25em 0 .8em}
input:focus,textarea:focus{outline:2px solid var(--blue);border-color:transparent}
label{font-size:.8em;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.note{font-size:.85em;color:var(--dim)}
.ok{color:var(--green);font-weight:700}
.err{color:var(--red);font-weight:700}

/* map grid */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:1.4em}
.door{background:linear-gradient(160deg,var(--card2),var(--card));border:1.5px solid rgba(201,162,75,.35);
  border-radius:16px;padding:1.2em 1.2em 1.1em;cursor:pointer;text-decoration:none;color:var(--ivory);
  transition:transform .15s,border-color .15s;position:relative;display:block}
.door:hover{transform:translateY(-3px);border-color:var(--gold)}
.door .ico{font-size:2rem}
.door .name{font-family:'Fraunces',serif;font-weight:640;font-size:1.35rem;margin:.25em 0 .1em}
.door .what{font-size:.85em;color:var(--dim)}
.door .tagline{font-size:.72em;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-top:.5em}
.livepill{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:50;display:none;
  background:var(--red);color:#fff;border-radius:999px;padding:.6em 1.4em;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.livepill a{color:#fff;text-decoration:none}
.crumb{margin-bottom:1.2em}
.crumb a{color:var(--dim);text-decoration:none;font-size:.85em;font-weight:700;letter-spacing:.06em}
.card{background:var(--card);border:1px solid rgba(201,162,75,.25);border-radius:14px;padding:1.1em 1.2em;margin:.8em 0}
.videoframe{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin:.8em 0}
.videoframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gem{display:inline-block;font-size:2.4rem;margin:.15em}
.qbox{background:var(--card);border:1px solid rgba(201,162,75,.3);border-radius:14px;padding:1.1em 1.2em;margin:1em 0}
.qbox .qn{font-weight:700;color:var(--gold);font-size:.8em;letter-spacing:.1em;text-transform:uppercase}
.qbox .qt{font-family:'Fraunces',serif;font-size:1.15em;margin:.3em 0 .2em}
.qbox .ref{color:var(--blue);font-weight:700;font-size:.9em;margin-bottom:.5em}
.progress{height:10px;background:var(--card);border-radius:999px;overflow:hidden;margin:.8em 0}
.progress div{height:100%;background:linear-gradient(90deg,var(--gold-dk),var(--gold));width:0%;transition:width .4s}
footer{margin-top:3em;text-align:center;color:var(--dim);font-size:.8em}
footer .v{font-family:'Fraunces',serif;font-style:italic;font-size:1.05em;color:var(--dim)}
.hide{display:none!important}
/* panel sections — clear visual zones */
.psec{border:1.5px solid rgba(201,162,75,.35);border-radius:16px;padding:1.1em 1.15em 1.25em;margin:1.1em 0;background:linear-gradient(160deg,var(--card2),var(--card))}
.psec>h2{color:var(--gold);margin:0 0 .2em;font-size:1.5rem}
.psec .pdesc{color:var(--dim);font-size:.9em;margin-bottom:.8em}
.psec .subcard{background:var(--card);border:1px solid rgba(244,237,224,.12);border-radius:12px;padding:.8em .9em;margin:.7em 0}
.psec .subcard>b{color:var(--ivory);display:block;margin-bottom:.3em}
.psave{margin-top:.5em}
/* pinned live-class video that stays at the top of the Mine while lessons scroll below */
#present-stage{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center}
#present-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;position:relative;z-index:0;pointer-events:none;background:#000}
#present-stage .pnav{position:fixed;inset:0;display:flex;z-index:1}
#present-stage .pnav .l,#present-stage .pnav .r{flex:1;cursor:pointer}
#present-stage #ps-exit{position:fixed;top:14px;right:16px;z-index:10;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.55);color:#fff;font-size:1.4rem;font-weight:700;cursor:pointer;opacity:.85;backdrop-filter:blur(4px)}
#present-stage #ps-exit:hover{opacity:1;background:rgba(0,0,0,.8)}









#classpin-persist:empty{display:none}
#classpin-persist{position:sticky;top:0;z-index:50;background:var(--walnut);padding:0 clamp(16px,4vw,40px)}
#classpin{position:sticky;top:0;z-index:40;background:var(--walnut);
  padding:.5em 0 .6em;margin:-.4em 0 .8em;border-bottom:1px solid rgba(201,162,75,.3)}
#classpin .pinvid{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
#classpin .pinvid iframe{width:100%;height:100%;border:0}
#classpin .pinbar{display:flex;align-items:center;gap:.6em;margin-bottom:.4em}
#classpin .pinbar b{color:var(--red)}
#classpin .pinclose{margin-left:auto;background:var(--card);border:1px solid rgba(244,237,224,.25);
  color:var(--ivory);border-radius:8px;padding:.25em .7em;font-size:.8em;font-weight:700;cursor:pointer}
/* ---- the ancient map beneath everything ---- */
#mapbg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}
#mapbg svg{width:100%;height:100%}
.wrap{position:relative;z-index:1}
.glassbar{position:relative;z-index:1}
.livepill{z-index:50}

  courses:[
   { id:"slow-to-anger", name:"Overcoming Anger", site:"Study 1", gem:"🔷", open:true,
     blurb:"\"Slow to Anger\" — the fire inside, and the God who is greater than it. For youth & young adults.",
     intro:"Tavita was seventeen — the best rugby player his island club had seen — and he carried a slow-burning anger no one could see, from the day his dad walked out. One shove at his cousin in the semifinal, and he snapped: red card, team down a man. That night on the sand he finally said it out loud: \"I can't control this. It controls me.\" That confession wasn't the end — it was the beginning. Because the God of the Bible names Himself slow to anger (Exodus 34:6). Anger management is not a technique. It is a Person.\n\nHow to dig: look up each text in your Bible, fill in the missing words exactly as you find them, then write what you unearthed.",

     invite:"Maybe you're the one holding the volcano. Maybe there's a name that tightens your chest when you hear it. Jesus is not standing over you with a red card — He is sitting next to you on the sand, the Savior who was mocked and nailed without once striking back (1 Peter 2:23), asking for the whole thing: the anger, the hurt underneath it, and the years you've lost to it. He is slow to anger — and quick to forgive. Will you hand Him the fire tonight?",

      {q:"What do I do with the old anger I've been carrying?",ref:"Ephesians 4:31–32",
       verse:"Let all bitterness, wrath, anger... be ___ away from you... And be ___ to one another, tenderhearted, ___ one another, even as God in Christ forgave you.",blanks:["put","kind","forgiving"],
       note:"Put it away like garbage — then let something move in: kindness, forgiveness, powered by the forgiveness we've received. Forgiving isn't saying the hurt didn't matter; it's handing the debt to Jesus, the better Judge (Romans 12:19). For Tavita, the hardest name on the list isn't the boy who shoved his cousin — it's his father. Grace is sufficient even for that.",
       think:"Whose name is hardest on your list? You don't have to feel ready — just write the initial."},
      {q:"Where does the power for self-control come from?",ref:"Galatians 5:22–23",
       verse:"But the ___ of the Spirit is love, joy, peace, longsuffering... gentleness, ___.",blanks:["fruit","self-control"],
       note:"Self-control is fruit of the Spirit, not of willpower — and fruit grows by connection, not effort (John 15:5: \"without Me you can do nothing\"). Counting to ten helps, but only the indwelling Spirit changes what you want to do at nine. Stay on the Vine: daily Word, instant prayer, quiet trust (Psalm 4:4).",
       think:"What does \"staying on the Vine\" actually look like in your daily schedule?"},
      {q:"What if I blow it again?",ref:"1 John 1:9",
       verse:"If we ___ our sins, He is faithful and just to ___ us our sins and to cleanse us from all unrighteousness.",blanks:["confess","forgive"],
       note:"God is not shocked — \"He remembers that we are dust\" (Psalm 103:14). A father doesn't disown a toddler for falling; he stands him up again. Growth looks like eruptions coming further apart, cooling faster, and driving you to Jesus sooner. He forgives the record and cleanses the temper.",
       think:"What's the difference between guilt that drives you FROM God and conviction that drives you TO Him?"},
      {part:"Part Three · Helping Someone Who Struggles",q:"What's the first gift I can give an angry friend?",ref:"Proverbs 18:13",
       verse:"He who answers a matter before he ___ it, it is folly and shame to him.",blanks:["hears"],
       note:"Listening. Under almost every angry teen is a hurt one, and hurt people don't open up to lecturers. Real listening — patience through silence, reflecting back (\"So you felt disrespected when...\") — helps a person finally name what they're angry about. Nobody reached Tavita on the field. Someone reached him on the beach, by sitting down and staying quiet.",
       think:"Who in your life needs your silence more than your advice right now?"},
      {q:"How should I speak when they're heating up?",ref:"Proverbs 15:1",
       verse:"A ___ answer turns away wrath, but a harsh word stirs up ___.",blanks:["soft","anger"],
       note:"Every word is water or petrol. A soft answer isn't weak — it takes more strength than matching volume — and it turns the whole encounter. Keep your voice lower than theirs, don't take the bait, affirm what's true before correcting what isn't. And check your own fire first (Matthew 7:3–5).",
       think:"Recall your last heated moment — were your words water or petrol?"},
      {q:"What does restoring an angry person look like?",ref:"Galatians 6:1–2",
       verse:"...restore such a one in a spirit of ___... Bear one another's ___, and so fulfill the law of Christ.",blanks:["gentleness","burdens"],
       note:"Restore is a medical word — setting a broken bone: gentle, patient, aimed at healing. Bear the burden with them: help them find what's underneath (Strike 2), pray with them, celebrate the day they didn't explode, correct one habit at a time, and suggest healthy release valves — exercise, writing it out, walking away early. Affirm the person while addressing the behavior. God does that with us.",
       think:"Who could you help \"set the bone\" for — and what's one gentle first step?"},
      {q:"When is it bigger than me — and where do we point them in the end?",ref:"Matthew 11:28–29",
       verse:"Come to Me, all you who labor and are heavy laden, and I will give you ___... for I am ___ and lowly in heart.",blanks:["rest","gentle"],
       note:"Some anger has roots too deep for a friend — trauma, violence at home, rage turned inward. Then love widens the circle: parents, a pastor, a godly counselor (Proverbs 11:14). That's not betrayal; it may save a life. Either way the destination is the same — not a technique, but a Person. Every angry heart is a tired heart. He gives rest.",

   { id:"joy-in-the-morning", name:"Overcoming Depression", site:"Study 2", gem:"🔷", open:true,
     blurb:"\"Joy Comes in the Morning\" — when the soul is cast down, and the God who sits with us in the dark. For youth & young adults.",
     intro:"Elijah had just lived the greatest day of his life — fire from heaven on Mount Carmel, a whole nation on its face crying, \"The LORD, He is God!\" Yet one threat from Queen Jezebel later, the strongest man of God in Israel was running for the desert, where he collapsed under a broom tree and prayed to die: \"It is enough! Now, LORD, take my life\" (1 Kings 19:4). Exhausted, empty, alone, convinced he was a failure and the only one left. If you have ever felt that darkness — or watched it swallow someone you love — notice carefully what God did next. No lecture. No \"snap out of it.\" He let Elijah sleep, sent an angel to cook him a meal — twice — spoke in a gentle whisper instead of the earthquake, corrected his hopeless math (seven thousand faithful remained), and gave him a friend named Elisha for the road ahead. God does not despise His depressed children. He kneels down and cooks them breakfast.\n\nHow to dig: look up each text in your Bible, fill in the missing words exactly as you find them, and tap the commentary to read the whole teaching.",
     safety:"If you — or someone you know — ever has thoughts of self-harm or suicide: tell a parent, pastor, teacher, or another trusted adult right away. In the U.S. you can also call or text 988 (Suicide & Crisis Lifeline) any time, day or night. Reaching out is strength, not weakness.",
     memory:{verse:"The LORD is near to those who have a broken heart.",ref:"Psalm 34:18"},
     invite:"Maybe you've been under the broom tree a long time — smiling at school, sinking at home, wondering if anyone would even notice. Hear this: the God who cooked breakfast for a burned-out prophet has not lost track of you. He is near to the broken-hearted, He does not break bruised reeds, and He speaks in a whisper gentle enough for a soul that can't handle one more earthquake. The night is real — but it is a night, not forever. Morning is His specialty. Will you stop carrying this alone — pour out your heart to Him tonight, and tell one trusted person this week — and let the God of hope begin walking you toward morning?",
     questions:[
      {part:"Part One · Understanding the Darkness",q:"Do real believers get depressed?",ref:"Psalm 42:5",
       verse:"Why are you cast ___, O my soul? And why are you ___ within me?",blanks:["down","disquieted"],
       note:"The Bible is startlingly honest: Elijah, Job, Moses, David, and Jeremiah all sank into the pit — and in Gethsemane Jesus Himself said, \"My soul is exceedingly sorrowful, even to death\" (Matthew 26:38). Depression is not proof that your faith has failed. Some of God's most faithful people have walked through the deepest dark."},
      {q:"Where does the darkness come from?",ref:"1 Kings 19:4–5",
       verse:"He prayed that he might ___... Then as he lay and slept under a broom tree, suddenly an ___ touched him.",blanks:["die","angel"],
       note:"Many streams feed it: an exhausted body, a crushing loss, rejection, stress, guilt, anger turned inward, and thought habits that paint self, world, and future black. Notice that God treated Elijah's body first — sleep and two hot meals before a single word of theology. The darkness is real, and it usually has real causes."},
      {q:"What does it do to us?",ref:"Psalm 32:3–4",

      {q:"What is God's posture toward the cast-down?",ref:"Psalm 34:18",

      {part:"Part Two · Walking Out of the Valley",q:"What's the first step — pretending, or pouring out?",ref:"Psalm 62:8",
       verse:"Trust in Him at all times, you people; ___ out your ___ before Him; God is a refuge for us.",blanks:["pour","heart"],
       note:"Buried feelings block the road out; poured-out feelings become prayer. God gave us a whole songbook of honest lament — dozens of psalms (6, 13, 42, 77, 142...) written from the pit. Read them aloud and let them lend you words. You cannot shock God with how you feel. He already knows — and stays."},
      {q:"What do I do with the dark thoughts on repeat?",ref:"Psalm 42:5",
       verse:"___ in God, for I shall yet ___ Him for the help of His countenance.",blanks:["Hope","praise"],
       note:"In Psalm 42 the writer stops merely listening to himself and starts talking to himself — preaching hope to his own soul. Do the same: answer \"I'm worthless\" with what God says is true, fix your mind on what is true, lovely, and praiseworthy (Philippians 4:8), and give thanks in everything (1 Thessalonians 5:18). Thoughts are trails; walk the dark ones less and they grow over."},
      {q:"Does my body matter in this battle?",ref:"1 Kings 19:7",
       verse:"The angel of the LORD came back the second time, and touched him, and said, 'Arise and ___, because the ___ is too great for you.'",blanks:["eat","journey"],
       note:"God's first prescription for a prophet who prayed to die was supper and a nap. Sleep, real food, sunlight, movement, and music (David's harp calmed Saul's dark moods, 1 Samuel 16:23) are not \"unspiritual\" — they are part of how God made us. And fight the pull to isolate: force yourself toward people, not away from them."},
      {q:"Is it weak — or faithless — to get help?",ref:"Proverbs 11:14",
       verse:"Where there is no counsel, the people ___; but in the multitude of ___ there is safety.",blanks:["fall","counselors"],
       note:"God didn't send Elijah back alone — He gave him Elisha. Telling a parent, pastor, doctor, or Christian counselor is not a failure of faith; it is often exactly how God answers your prayer. Depression can have physical roots, and God works through wise people, and sometimes medicine, the same way He works through a cast on a broken arm."},
      {part:"Part Three · Helping Someone in the Dark",q:"What's the first gift I can give?",ref:"Romans 12:15",

      {q:"What should I say — and never say?",ref:"Proverbs 25:20",
       verse:"Like... vinegar on soda is one who sings ___ to a heavy ___.",blanks:["songs","heart"],

   { id:"never-alone", name:"Overcoming Loneliness", site:"Study 3", gem:"🔷", open:true,

/* ===== LIVE CIRCLES: signed, sealed, moderated, embedded ===== */
const JAAS_APPID='vpaas-magic-cookie-86d8e477e0754382b3deab81b3e8dcfb';
const SIGNER_URL='/.netlify/functions/circle-token';
/* remember a moderator pass for this browser session only (never stored to disk) */
let SESSION_MOD_PASS=null;

/* Build the public (unauthenticated) fallback URL — today's behaviour. */
function publicCircleUrl(room){
  return 'https://8x8.vc/'+JAAS_APPID+'/'+encodeURIComponent(room)
    +'#config.prejoinConfig.enabled=true&config.disableDeepLinking=true';
}
/* Build the signed URL once we have a token. */
function signedCircleUrl(room,token){
  return 'https://8x8.vc/'+JAAS_APPID+'/'+encodeURIComponent(room)
    +'?jwt='+token
    +'#config.prejoinConfig.enabled=true&config.disableDeepLinking=true';
}

/*
 mountCircle: fill a container with an embedded JaaS iframe for `room`.
 - Asks the signer for a token (moderator if SESSION_MOD_PASS is set & correct).
 - On ANY failure (signer down, network, non-ok) → silently loads the public room,
   so a live service NEVER breaks mid-stream.
 containerId: the id of a .videoframe div to fill.
 name: display name to show in the circle.
*/
async function mountCircle(containerId,room,name){
  const el=document.getElementById(containerId);
  if(!el)return;
  const frame=src=>`<iframe src="${src}" allow="camera;microphone;fullscreen;display-capture;autoplay" style="width:100%;height:100%;border:0"></iframe>`;
  /* start on public fallback immediately so there's never a blank frame */
  el.innerHTML=frame(publicCircleUrl(room));
  try{
    const qs='?room='+encodeURIComponent(room)+'&name='+encodeURIComponent(name||'Friend')
      +(SESSION_MOD_PASS?('&pass='+encodeURIComponent(SESSION_MOD_PASS)):'');
    const res=await fetch(SIGNER_URL+qs,{cache:'no-store'});
    if(!res.ok)throw new Error('signer '+res.status);
    const data=await res.json();
    if(data&&data.ok&&data.token){
      /* swap to the signed (sealed) room */
      el.innerHTML=frame(signedCircleUrl(room,data.token));
      el.dataset.mod=data.moderator?'1':'0';
    }
    /* if data.ok is false, we simply keep the public fallback already showing */
  }catch(e){
    /* keep the public fallback — nothing breaks */
  }
}

function enterPresentStage(){
  var total=(C.sermons&&C.sermons.total)||0;
  var cur=Math.min(Math.max(1,(C.sermons&&C.sermons.current)||1),Math.max(1,total));
  var stage=document.getElementById('present-stage');
  if(!stage){ stage=document.createElement('div'); stage.id='present-stage'; document.body.appendChild(stage); }

  // Preload every slide in the background so advancing is instant (no black flash).
  var cache={};
  function preload(i){ if(i<1||i>total||cache[i])return; var im=new Image(); im.src=SERMONS_PATH+i+SLIDES_EXT; cache[i]=im; }
  for(var i=1;i<=total;i++){ preload(i); }

  // Build the stage ONCE with a persistent <img> we just swap src on (no full re-render, no flash).
  stage.innerHTML='<img id="ps-img" src="'+SERMONS_PATH+cur+SLIDES_EXT+'" alt="Slide '+cur+'">'
    +'<div class="pnav"><div class="l" id="ps-prev"></div><div class="r" id="ps-next"></div></div>'
    +'<button id="ps-exit" title="Exit">✕</button>';
  var img=document.getElementById('ps-img');
  document.getElementById('ps-next').onclick=goNext;
  document.getElementById('ps-prev').onclick=goPrev;
  document.getElementById('ps-exit').onclick=function(){ stage.remove(); };

  function show(){
    // swap src only; because it's preloaded, it appears immediately (INSTANT for the room)
    if(img)img.src=SERMONS_PATH+cur+SLIDES_EXT;
    preload(cur+1); preload(cur-1);  // keep neighbours warm
  }
  var _pending=null;
  function syncFB(){
    // Push to ONLINE viewers, delayed to match the YouTube stream lag (projector already updated instantly).
    var delayMs=Math.max(0,(+(C.config&&C.config.slidedelay)||0))*1000;
    var target=cur;
    if(_pending)clearTimeout(_pending);
    if(delayMs===0){ try{ sermonWrite({current:target}); }catch(e){} return; }
    _pending=setTimeout(function(){ try{ sermonWrite({current:target}); }catch(e){} },delayMs);
  }
  function goNext(){ if(cur<total){ cur++; show(); syncFB(); } }
  function goPrev(){ if(cur>1){ cur--; show(); syncFB(); } }

  document.addEventListener('keydown',function pk(e){
    if(!document.getElementById('present-stage')){document.removeEventListener('keydown',pk);return;}
    if(e.key==='ArrowRight'||e.key===' '||e.key==='Spacebar'||e.key==='ArrowDown'||e.key==='PageDown'||e.key==='Enter'){e.preventDefault();goNext();}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'||e.key==='Backspace'){e.preventDefault();goPrev();}
    else if(e.key==='Escape'){e.preventDefault();stage.remove();}
  });
}

function vein(veinId){

  const prog=readProg(c.id);

    if(a&&typeof a==='object')return (a.b&&a.b.some(x=>(x||'').trim().length>0))||(a.r&&(a.r||'').trim().length>2);
    return false;
  });
  let status = done ? `<span class="ok">${c.gem} Treasure unearthed</span>`

function dig(courseId){

const CO=courseById(courseId);
if(!CO||!CO.open){go('mine');return}
const prog=readProg(CO.id);
const answers=prog.answers||{};
const done=prog.completed;
const norm=s=>(s||'').toLowerCase().replace(/[^a-z]/g,'');
const qDone=(qq,i)=>{
  const a=answers[i];
  if(qq.blanks){ if(!a||!a.b)return false; return qq.blanks.every((w,j)=>norm(a.b[j])===norm(w)); }
  return typeof a==='string'&&a.trim().length>2;
};
let qhtml=CO.questions.map((qq,i)=>{
 if(qq.blanks){
  const a=answers[i]||{b:[],r:''};
  let bi=0;
  const versehtml=esc(qq.verse).split('___').map((seg,j,arr)=>seg+(j<arr.length-1?`<input type="text" class="blank" data-q="${i}" data-b="${bi}" value="${esc((a.b||[])[bi]||'')}" style="width:${Math.max(4,(qq.blanks[bi]||'').length+2)}ch;display:inline-block;margin:0 .15em;padding:.1em .35em;text-align:center;font-weight:700" placeholder="____">`+(bi++,''):'')).join('');
  return `${qq.part?`<div class="eyebrow" style="margin:1.6em 0 .4em">${esc(qq.part)}</div>`:''}<div class="qbox">
   <div class="qn">Strike ${i+1} of ${CO.questions.length}</div>
   <div class="qt">${esc(qq.q)}</div>
   <div class="ref">⛏️ Open your Bible (NKJV): <a href="${bibleUrl(qq.ref)}" target="_blank" rel="noopener">${esc(qq.ref)}</a> — fill in the missing words</div>
   <p style="font-family:'Fraunces',serif;font-style:italic;line-height:2">"${versehtml}"</p>
   <p class="note" style="margin:-.2em 0 .4em;text-align:right"><a href="#" data-reveal="${i}" style="color:var(--dim)">🔦 Stuck? Shine a light</a></p>
   ${qq.note?`<div class="ref" style="cursor:pointer;color:var(--gold)" data-exp="${i}">📜 Read the commentary ▾</div>
   <div class="hide" id="exp-${i}">
     <p style="margin:.3em 0 .5em;line-height:1.75">${esc(qq.note)}</p>
   </div>`:''}
  </div>`;
 }
 return `<div class="qbox">
  <div class="qn">Strike ${i+1} of ${CO.questions.length}</div>
  <div class="qt">${esc(qq.q)}</div>
  <div class="ref">⛏️ Dig here: <a href="${bibleUrl(qq.ref)}" target="_blank" rel="noopener">${esc(qq.ref)}</a></div>
  <textarea rows="2" data-q="${i}" placeholder="Write what you unearthed...">${esc(answers[i]||'')}</textarea>
 </div>`;
}).join('');
const filled=CO.questions.filter((qq,i)=>qDone(qq,i)).length;
const pct=Math.round(filled/CO.questions.length*100);
const VV=veinOf(CO.id);
app.innerHTML=`<div class="crumb"><a href="#vein-${VV.id}">${VV.gem} ← Back to ${esc(VV.label)}</a></div>
 <div class="eyebrow">${VV.gem} ${esc(VV.name)} · ${esc(CO.site)}</div>
 <h2>${esc(CO.name)}</h2>
 ${done?`
   <div class="card" style="text-align:center;border-color:var(--gold)">
     <div style="font-size:3rem">${CO.gem}</div>
     <h2 style="color:var(--gold)">Treasure unearthed!</h2>
     <p>You completed this dig site${prog.name?', '+esc(prog.name.split(' ')[0]):''}. Its gem now rests in <a href="#treasury">your Treasury 👑</a>.</p>
     ${prog.anon?`<p class="note" style="margin-top:.6em">Unearthed quietly — between you and God. 🕊️</p>`:`<p class="note" style="margin-top:.6em">A token of this treasure is on its way to you by mail. 🎁</p>`}
   </div>
   ${CO.safety?`<div class="card" style="border-color:var(--red)"><b style="color:var(--red)">❤️ Always true:</b><div style="margin-top:.3em">${esc(CO.safety)}</div></div>`:''}`
 :`
 <p class="sub">${esc(CO.intro||'')}</p>
 <div class="card note" style="padding:.6em 1em">📖 Scripture in this study is quoted from the <b>New King James Version (NKJV)</b>. Using a different Bible — or none at hand? Tap any reference to read the NKJV free online; the missing words come from that translation.</div>
 <div class="progress"><div style="width:${pct}%"></div></div>
 <p class="note" id="strikecount">${filled} of ${CO.questions.length} veins struck</p>
 ${qhtml}
 ${CO.safety?`<div class="card" style="border-color:var(--red)"><b style="color:var(--red)">❤️ Read this — it matters:</b><div style="margin-top:.3em">${esc(CO.safety)}</div></div>`:''}
 <div id="finishzone" class="${filled===CO.questions.length?'':'hide'}">
  ${CO.invite?`<div class="card" style="border-color:var(--gold)">
    <h2 style="color:var(--gold)">An invitation — just for you</h2>
    <p>${esc(CO.invite)}</p>
    <label class="f" style="display:block;margin-top:.6em">My response</label>
    <textarea id="m-invite" rows="2" placeholder="Write it in your own words — this goes privately to Pastor Josh with your claim."></textarea>
  </div>`:''}
  ${CO.memory?`<div class="card"><b style="color:var(--gold)">💛 Hide it in your heart — this study's memory verse</b>
    <div class="verse" style="margin:.5em 0 0"><p>"${esc(CO.memory.verse)}"</p><cite>${esc(CO.memory.ref)} · NKJV</cite></div></div>`:''}
  <div class="card" style="border-color:var(--gold)">
    <h2 style="color:var(--gold)">⛏️ The final swing</h2>
    <p class="note" style="margin-bottom:.6em">Claim your gem — and tell Pastor Josh where to mail your treasure token. Your details are private to him alone.</p>
    <label>Your name</label><input type="text" id="m-name" placeholder="Full name">
    <label>Email or phone</label><input type="text" id="m-contact" placeholder="Best way to reach you">
    <label>Mailing address (for your gift)</label><textarea id="m-addr" rows="2" placeholder="Street, city, state, zip"></textarea>
    <div id="m-err" class="err"></div>
    <button class="btn" id="m-claim">${CO.gem} Claim the treasure</button>
    <p class="note" style="margin-top:.9em;text-align:center">🕊️ Prefer to stay anonymous? <a href="#" id="m-quiet">Keep your gem without sharing your details</a> — no mail, no name, and that's completely okay.</p>
  </div>
 </div>
 <div class="card note">💾 Your digging saves itself on this device — leave and return anytime.</div>
 `}
 <div class="card" style="text-align:center;border-color:var(--gold)">
   <b>📄 Take this study with you</b>
   <p class="note" style="margin:.4em 0 .7em">Download the whole study — story, all the texts with answers, and commentary — to keep, print, or share.</p>
   <button class="btn" id="study-print">📄 Download this study</button>
 </div>
 ${footer()}`;

if(!done){
  const refresh=()=>{
    localStorage.setItem('mine-'+CO.id,JSON.stringify({answers}));
    const f=CO.questions.filter((qq,i)=>qDone(qq,i)).length;
    document.querySelector('.progress div').style.width=Math.round(f/CO.questions.length*100)+'%';
    const cnt=document.getElementById('strikecount'); if(cnt)cnt.textContent=f+' of '+CO.questions.length+' veins struck';
    document.getElementById('finishzone').classList.toggle('hide',f!==CO.questions.length);
  };
  app.querySelectorAll('[data-reveal]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.preventDefault();
      const i=+el.dataset.reveal, qq=CO.questions[i];
      if(!answers[i]||typeof answers[i]==='string')answers[i]={b:[],r:''};
      app.querySelectorAll('input.blank[data-q="'+i+'"]').forEach(inp=>{
        const b=+inp.dataset.b;
        inp.value=qq.blanks[b]; answers[i].b[b]=qq.blanks[b];
        inp.style.borderColor='var(--gold)'; inp.style.color='var(--gold)';
      });
      el.textContent='💡 Light shone — now read it in your Bible too';
      refresh();
    });
  });
  app.querySelectorAll('[data-exp]').forEach(el=>{
    el.addEventListener('click',()=>{
      const box=document.getElementById('exp-'+el.dataset.exp);
      box.classList.toggle('hide');
      el.textContent=box.classList.contains('hide')?'📜 Read the commentary ▾':'📜 Commentary ▴';
    });
  });
  app.querySelectorAll('input.blank').forEach(inp=>{
    const i=+inp.dataset.q, b=+inp.dataset.b, qq=CO.questions[i];
    const paint=()=>{const ok=norm(inp.value)===norm(qq.blanks[b]);
      inp.style.borderColor=inp.value.trim()?(ok?'var(--gold)':'rgba(194,91,74,.7)'):'rgba(244,237,224,.25)';
      inp.style.color=ok?'var(--gold)':'var(--ivory)';};
    paint();
    inp.addEventListener('input',()=>{
      if(!answers[i]||typeof answers[i]==='string')answers[i]={b:[],r:(answers[i]&&answers[i].r)||''};
      answers[i].b[b]=inp.value; paint(); refresh();
    });
  });
  app.querySelectorAll('textarea[data-q]').forEach(tx=>{
    tx.addEventListener('input',()=>{
      answers[+tx.dataset.q]=tx.value;
      refresh();
    });
  });
  const quiet=document.getElementById('m-quiet');
  if(quiet)quiet.onclick=async(e)=>{
    e.preventDefault();
    quiet.textContent='Setting your gem…';
    try{ if(db)await db.ref('completions').push({course:CO.id,name:'(anonymous)',anon:true,time:new Date().toLocaleString(),ts:Date.now()}); }catch(err){}
    localStorage.setItem('mine-'+CO.id,JSON.stringify({answers,completed:true,anon:true}));
    render();
  };
  const pbtn=document.getElementById('study-print');
  if(pbtn)pbtn.onclick=()=>printStudy(CO.id);
  const claim=document.getElementById('m-claim');
  if(claim)claim.onclick=async()=>{
    const name=document.getElementById('m-name').value.trim();
    const contact=document.getElementById('m-contact').value.trim();
    const addr=document.getElementById('m-addr').value.trim();
    const err=document.getElementById('m-err');
    if(!name){err.textContent='Please add your name.';return}
    claim.textContent='Claiming…';claim.disabled=true;
    try{
      const invite=(document.getElementById('m-invite')||{value:''}).value.trim();
      if(db)await db.ref('completions').push({course:CO.id,name,contact,addr,invite,answers,time:new Date().toLocaleString(),ts:Date.now()});
      localStorage.setItem('mine-'+CO.id,JSON.stringify({answers,completed:true,name}));
      render();
    }catch(e){err.textContent='Could not reach the vault — check connection and try again.';claim.textContent=CO.gem+' Claim the treasure';claim.disabled=false}
  };
}
}

const all=(C.trail||[]).map(x=>({...x,d:new Date(x.date+'T12:00:00')})).sort((a,b)=>a.d-b.d);
const up=all.filter(x=>x.d>=today&&x.d<=horizon);
const beyond=all.filter(x=>x.d>horizon).length;
const past=all.filter(x=>x.d<today).slice(-4);
const ICONS={church:'⛪',tent:'🎪',camp:'🏕️',mic:'🎙️',fire:'🔥',study:'📖',youth:'🧑‍🤝‍🧑'};
const mark=(x,i,dim)=>{
  const ico=ICONS[(x.icon||'').toLowerCase()]||'⛪';
  return `<div class="stop ${dim?'past':''}" data-i="${i}">
    <div class="stopmark">${ico}</div>
    <div class="stopcard">
      <div class="stophead">
        <b style="color:var(--gold)">${x.d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</b>
        <b>${esc(x.title)}</b>
        <span class="note" style="margin-left:auto">tap ▾</span>
      </div>
      <div class="stopbody hide">
        <div>📍 <a href="${mapsUrl(x.place)}" target="_blank" rel="noopener"><b>${esc(x.place)}</b></a> <span class="note">· tap for directions</span></div>
        ${x.time?`<div>🕐 ${esc(x.time)}</div>`:''}
        ${x.live?`<div>🔴 Also broadcast live — <a href="#watchfire">gather at the Watchfire</a></div>`:`<div class="note">In person only — come find the guide on the trail</div>`}
        ${x.details?`<div class="note" style="margin-top:.4em">${esc(x.details)}</div>`:''}
      </div>
    </div>
  </div>`;
};

  document.getElementById('p-which-wrap').classList.toggle('hide',document.getElementById('p-home').value!=='other-church');
};
wireLordsPrayer();
document.getElementById('p-call').onchange=document.getElementById('p-visit').onchange=()=>{
  const call=document.getElementById('p-call').checked, visit=document.getElementById('p-visit').checked;
  document.getElementById('p-contact-wrap').classList.toggle('hide',!(call||visit));
  document.getElementById('p-addr-wrap').classList.toggle('hide',!visit);
};
document.getElementById('p-send').onclick=async()=>{
  const name=document.getElementById('p-name').value.trim();
  const msg=document.getElementById('p-msg').value.trim();
  const share=document.getElementById('p-share').value;
  const call=document.getElementById('p-call').checked;
  const visit=document.getElementById('p-visit').checked;
  const contact=document.getElementById('p-contact').value.trim();
  const addr=document.getElementById('p-addr').value.trim();
  const when=(document.getElementById('p-when')||{value:''}).value.trim();
  const home=document.getElementById('p-home').value;
  const which=document.getElementById('p-which').value.trim();
  const err=document.getElementById('p-err');
  const b=document.getElementById('p-send');
  if(!name||!msg){err.textContent='A name and a request — that\'s all that\'s needed.';return}
  if((call||visit)&&!contact){err.textContent='Add a phone or email so Pastor Josh can reach you.';return}
  if(visit&&!addr){err.textContent='Add an address for the visit.';return}
  b.textContent='Sending…';b.disabled=true;
  try{
    if(db){
      await db.ref('prayer').push({name,msg,share,call,visit,contact,addr,when,home,which,time:new Date().toLocaleString(),ts:Date.now()});

    }

  }catch(e){err.textContent='Could not send — check your connection and try again.';b.textContent='🕊️ Send to the Altar';b.disabled=false}
};
}

  <div class="subcard">
   <b>📽️ Presenter code (for you or a guest speaker)</b>
   <div class="note" style="margin-bottom:.3em">Give this to whoever runs the slides. It opens <b>Presenter mode</b> (full-screen slides) only — never the Steward's Panel or your private keys. The presenter page is at <b>#present</b>.</div>
   <label>Presenter code</label>
   <input type="text" id="pr-codeset" value="${esc((C.config&&C.config.presentcode)||'present2026')}">
   <button class="btn psave" id="save-pr">Save presenter code</button> <span id="pr-ok" class="ok"></span>
  </div>
 </div>

 <!-- ========== 5. SCHEDULE ========== -->
 <div class="psec">
  <h2>🥾 The Trail — schedule</h2>
  <div class="pdesc">Where you'll be, and your weekly rhythm. Each saves separately.</div>

  <div class="subcard">
   <b>📍 Trail stops (dated events)</b>
   <label>One per line: DATE | TITLE | PLACE | TIME | live yes/no | ICON | details</label>
   <textarea id="tr-items" rows="6">${(C.trail||[]).map(x=>[x.date,x.title,x.place,x.time||'',x.live?'yes':'no',x.icon||'church',x.details||''].join(' | ')).join('\n')}</textarea>
   <button class="btn psave" id="save-tr">Save the Trail</button> <span id="tr-ok" class="ok"></span>
  </div>

  <div class="subcard">
   <b>🕰️ Weekly Rhythm (standing appointments)</b>
   <label>One per line: DAY | TIME | WHAT | WHERE | door(altar/class/watchfire) · none = 📍 map · plain = no link</label>
   <textarea id="rh-items" rows="5">${(C.rhythm||[]).map(x=>[x.day,x.time,x.what,x.where,x.link||'none'].join(' | ')).join('\n')}</textarea>
   <button class="btn psave" id="save-rh">Save the Rhythm</button> <span id="rh-ok" class="ok"></span>
  </div>
 </div>

 <!-- ========== 6. READING RESPONSES ========== -->
 <div class="psec">
  <h2>📬 Reading what comes in</h2>
  <div class="pdesc">Responses are private — read them in your Firebase console.</div>
  <p class="note">Prayer requests → <b>prayer</b> &nbsp;·&nbsp; Bible-school completions &amp; gift addresses → <b>completions</b><br>console.firebase.google.com → joshuamura → Realtime Database → Data</p>
 </div>

`;
document.getElementById('save-d').onclick=async()=>{
  try{
    const old=C.devotional;
    const nu={k:WRITE_KEY,title:v('d-title'),youtubeId:v('d-yt'),verse:v('d-verse'),verseref:v('d-ref'),thought:v('d-thought')};
    if(old.youtubeId && old.youtubeId!==nu.youtubeId){
      const items=[{title:old.title,youtubeId:old.youtubeId,verseref:old.verseref||''},...(C.archive||[])].slice(0,200);
      await db.ref('content/archive').set({k:WRITE_KEY,items});
    }
    await db.ref('content/devotional').set(nu);
    document.getElementById('d-ok').textContent='Saved ✓ — flowing now. Previous week lowered into the Deep Well.';
  }catch(e){document.getElementById('d-ok').textContent='Save failed — rules published?';}
};
document.getElementById('save-l').onclick=async()=>{
  try{await db.ref('content/live').set({k:WRITE_KEY,
    expedition:{on:document.getElementById('e-on').value==='yes',title:v('e-title'),source:document.getElementById('e-src').value,youtubeId:v('e-yt'),room:v('e-room'),deckUrl:v('e-deck'),study:v('e-study'),note:v('e-note')},
    prayer:{on:document.getElementById('p2-on').value==='yes',room:v('p2-room'),note:v('p2-note')},
    teaching:{on:document.getElementById('t-on').value==='yes',room:v('t-room'),note:v('t-note')}
  });
  document.getElementById('l-ok').textContent='Saved ✓ — the map knows what is live.';}catch(e){document.getElementById('l-ok').textContent='Save failed — rules published?';}
};
async function sermonWrite(patch){
  const cur={total:+(C.sermons.total||0),on:!!C.sermons.on,current:(C.sermons&&C.sermons.current)||1, ...patch};
  cur.total=Math.min(50,Math.max(0,cur.total));
  cur.current=Math.min(Math.max(1,cur.current),Math.max(1,cur.total));
  await db.ref('content/sermons').set({k:WRITE_KEY,on:cur.on,total:cur.total,current:cur.current});
  C.sermons={...C.sermons,...cur};
}
async function slideWrite(patch){
  const cur={total:+(document.getElementById('sl-total').value||0),
             on:document.getElementById('sl-on').value==='yes',
             current:(C.slides&&C.slides.current)||1, ...patch};
  cur.total=Math.min(50,Math.max(0,cur.total));
  cur.current=Math.min(Math.max(1,cur.current),Math.max(1,cur.total));
  await db.ref('content/slides').set({k:WRITE_KEY,on:cur.on,total:cur.total,current:cur.current});
  C.slides={...C.slides,...cur};
  const now=document.getElementById('sl-now'); if(now)now.textContent='Slide '+cur.current+' of '+cur.total;
}
document.getElementById('save-sl').onclick=async()=>{
  try{ await slideWrite({}); document.getElementById('sl-ok').textContent='Saved ✓'; }
  catch(e){ document.getElementById('sl-ok').textContent='Save failed — rules published?'; }
};
document.getElementById('sl-next').onclick=async()=>{ try{ await slideWrite({current:((C.slides&&C.slides.current)||1)+1}); }catch(e){} };
document.getElementById('sl-prev').onclick=async()=>{ try{ await slideWrite({current:((C.slides&&C.slides.current)||1)-1}); }catch(e){} };
function seUpd(){const n=document.getElementById('se-now'); if(n)n.textContent='Slide '+((C.sermons&&C.sermons.current)||1)+' of '+((C.sermons&&C.sermons.total)||0);}
document.getElementById('save-se').onclick=async()=>{
  try{
    await sermonWrite({total:+(document.getElementById('se-total').value||0),on:document.getElementById('se-on').value==='yes'});
    var dly=Math.max(0,Math.min(60,+(document.getElementById('se-delay').value||0)));
    await db.ref('content/config').set({k:WRITE_KEY,teamcode:(C.config.teamcode||'pray2026'),classcode:(C.config.classcode||'class2026'),presentcode:(C.config.presentcode||'present2026'),slidedelay:dly});
    C.config.slidedelay=dly;
    seUpd(); document.getElementById('se-ok').textContent='Saved ✓'; }
  catch(e){ document.getElementById('se-ok').textContent='Save failed — rules published?'; }
};
document.getElementById('se-next').onclick=async()=>{ try{ await sermonWrite({current:((C.sermons&&C.sermons.current)||1)+1}); seUpd(); }catch(e){} };
document.getElementById('se-prev').onclick=async()=>{ try{ await sermonWrite({current:((C.sermons&&C.sermons.current)||1)-1}); seUpd(); }catch(e){} };
document.getElementById('save-pr').onclick=async()=>{
  try{
    await db.ref('content/config').set({k:WRITE_KEY,teamcode:(C.config.teamcode||'pray2026'),classcode:(C.config.classcode||'class2026'),presentcode:v('pr-codeset'),slidedelay:(C.config.slidedelay||0)});
    C.config.presentcode=v('pr-codeset');
    document.getElementById('pr-ok').textContent='Saved ✓';
  }catch(e){ document.getElementById('pr-ok').textContent='Save failed'; }
};
document.getElementById('save-cl').onclick=async()=>{
  try{
    await db.ref('content/config').set({k:WRITE_KEY,teamcode:(C.config.teamcode||'pray2026'),classcode:v('cl-code'),presentcode:(C.config.presentcode||'present2026'),slidedelay:(C.config.slidedelay||0)});
    /* save topic alongside the rest of the live block so the section-key rule is satisfied */
    const L=C.live;
    await db.ref('content/live').set({k:WRITE_KEY,
      prayer:{on:L.prayer.on,room:L.prayer.room,note:L.prayer.note},
      teaching:{on:L.teaching.on,room:L.teaching.room,topic:v('cl-topic'),note:L.teaching.note},
      expedition:{on:L.expedition.on,title:L.expedition.title,source:L.expedition.source,youtubeId:L.expedition.youtubeId,room:L.expedition.room,deckUrl:L.expedition.deckUrl,study:L.expedition.study,note:L.expedition.note}
    });
    C.config.classcode=v('cl-code'); C.live.teaching.topic=v('cl-topic');
    document.getElementById('cl-ok').textContent='Saved ✓';
  }catch(e){ document.getElementById('cl-ok').textContent='Save failed — rules published?'; }
};
document.getElementById('save-tc').onclick=async()=>{
  try{await db.ref('content/config').set({k:WRITE_KEY,teamcode:v('tc-code'),classcode:(C.config.classcode||'class2026'),presentcode:(C.config.presentcode||'present2026'),slidedelay:(C.config.slidedelay||0)});
  C.config.teamcode=v('tc-code');
  document.getElementById('tc-ok').textContent='Saved ✓ — new code in force.';}catch(e){document.getElementById('tc-ok').textContent='Save failed.';}
};
document.getElementById('save-tr').onclick=async()=>{
  try{
    const items=document.getElementById('tr-items').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const p=l.split('|').map(s=>s.trim());
      return {date:p[0]||'',title:p[1]||'',place:p[2]||'',time:p[3]||'',live:(p[4]||'').toLowerCase().startsWith('y'),icon:p[5]||'church',details:p[6]||''};
    }).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&x.title);
    await db.ref('content/trail').set({k:WRITE_KEY,items});
    document.getElementById('tr-ok').textContent='Saved ✓ — '+items.length+' stops marked on the trail.';
  }catch(e){document.getElementById('tr-ok').textContent='Save failed.';}
};
document.getElementById('save-rh').onclick=async()=>{
  try{
    const items=document.getElementById('rh-items').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const p=l.split('|').map(s=>s.trim());
      return {day:p[0]||'',time:p[1]||'',what:p[2]||'',where:p[3]||'',link:(p[4]||'none')};
    }).filter(x=>x.day&&x.what);
    await db.ref('content/rhythm').set({k:WRITE_KEY,items});
    document.getElementById('rh-ok').textContent='Saved ✓ — '+items.length+' standing appointments.';
  }catch(e){document.getElementById('rh-ok').textContent='Save failed.';}
};
function v(id){return document.getElementById(id).value.trim()}
}

/* ================= LIVE PILL ================= */
function showLivePill(){
  const lit=[];
  if(C.live.expedition.on)lit.push(['watchfire','🔥 Worship']);
  if(C.live.prayer.on)lit.push(['altar','🙏 Prayer']);
  if(C.live.teaching.on)lit.push(['class','📖 Class']);
  const p=document.getElementById('livepill');
  if(lit.length){p.style.display='block';
    p.innerHTML=`<a href="#${lit[0][0]}">🔥 LIVE NOW: ${lit.map(l=>l[1]).join(' · ')} — tap to gather</a>`;
  } else p.style.display='none';
}

render();
</script>
