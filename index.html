<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A Vision for Our Sanctuary — Bucks County SDA Church</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,540;9..144,640&family=Source+Sans+3:wght@400;600;700&display=swap');

:root{
  --walnut:#1d1510;
  --walnut-2:#2a1f17;
  --card:#33261c;
  --ivory:#f4ede0;
  --ivory-dim:#cbbfae;
  --gold:#c9a24b;
  --glass-blue:#5b8fd9;
  --glass-red:#c25b4a;
  --glass-green:#5f9e6e;
  --ok:#7fbf8a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--walnut);
  color:var(--ivory);
  font-family:'Source Sans 3',system-ui,sans-serif;
  font-size:clamp(16px,1.35vw,22px);
  line-height:1.55;
  overflow:hidden;
}
#stage{
  height:100dvh;display:flex;flex-direction:column;
}
/* stained-glass hairline — the signature */
.glassbar{
  height:5px;flex:none;
  background:linear-gradient(90deg,#27408b 0%,#5b8fd9 18%,#5f9e6e 38%,#e0c068 55%,#c9722e 75%,#c25b4a 100%);
}
#viewport{flex:1;position:relative;overflow:hidden}
.slide{
  position:absolute;inset:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:clamp(18px,4vw,64px) clamp(18px,5vw,80px) 110px;
  opacity:0;transform:translateX(40px);
  transition:opacity .35s ease,transform .35s ease;
  pointer-events:none;
}
.slide.active{opacity:1;transform:none;pointer-events:auto}
.slide.exit-left{opacity:0;transform:translateX(-40px)}
.inner{max-width:860px;margin:0 auto}

.eyebrow{
  font-size:.72em;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);font-weight:700;margin-bottom:.9em;
}
h1{
  font-family:'Fraunces',serif;font-weight:640;
  font-size:clamp(2.1rem,6.5vw,4.4rem);line-height:1.08;
  margin-bottom:.35em;
}
h2{
  font-family:'Fraunces',serif;font-weight:540;
  font-size:clamp(1.5rem,4.2vw,2.6rem);line-height:1.15;
  margin-bottom:.55em;
}
.sub{color:var(--ivory-dim);font-size:1.02em;max-width:34em}
.price{
  font-family:'Fraunces',serif;font-weight:640;color:var(--gold);
  font-size:clamp(1.6rem,4.5vw,2.6rem);margin:.35em 0 .5em;
}
.price small{font-family:'Source Sans 3';font-size:.42em;font-weight:600;color:var(--ivory-dim);letter-spacing:.04em}
ul.points{list-style:none;margin:.9em 0}
ul.points li{
  padding:.42em 0 .42em 1.5em;position:relative;color:var(--ivory);
}
ul.points li::before{
  content:'';position:absolute;left:0;top:.94em;width:.62em;height:.62em;
  border-radius:2px;background:var(--glass-blue);transform:rotate(45deg);
}
ul.points li b{color:var(--gold);font-weight:700}
.photo{
  width:100%;border-radius:12px;display:block;
  box-shadow:0 10px 34px rgba(0,0,0,.45);margin:.7em 0;
}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:.8em 0}
@media(max-width:640px){.split{grid-template-columns:1fr}}
.cap{font-size:.78em;color:var(--ivory-dim);text-align:center;margin-top:-2px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.card{
  background:var(--card);border:1px solid rgba(201,162,75,.25);
  border-radius:14px;padding:1em 1.15em;margin:.6em 0;
}
table{width:100%;border-collapse:collapse;margin:.7em 0;font-size:.95em}
td,th{padding:.5em .35em;text-align:left;border-bottom:1px solid rgba(244,237,224,.14)}
td:last-child,th:last-child{text-align:right;white-space:nowrap}
tr.total td{border-bottom:none;color:var(--gold);font-weight:700;font-size:1.08em}
.tag{
  display:inline-block;background:rgba(91,143,217,.18);color:var(--glass-blue);
  border:1px solid rgba(91,143,217,.45);border-radius:999px;
  padding:.14em .8em;font-size:.72em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:1em;
}
.tag.gold{background:rgba(201,162,75,.14);color:var(--gold);border-color:rgba(201,162,75,.5)}

/* ------- chrome ------- */
#chrome{
  position:fixed;left:0;right:0;bottom:0;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(transparent,rgba(20,14,10,.92) 38%);
  z-index:40;
}
.navbtn{
  background:var(--card);color:var(--ivory);border:1px solid rgba(244,237,224,.22);
  border-radius:12px;font-family:inherit;font-size:1rem;font-weight:700;
  padding:.7em 1.25em;cursor:pointer;user-select:none;
}
.navbtn:active{transform:scale(.96)}
.navbtn.primary{background:var(--gold);color:#241a0d;border-color:var(--gold)}
.navbtn[disabled]{opacity:.35;pointer-events:none}
#counter{font-size:.85rem;color:var(--ivory-dim);font-weight:600;letter-spacing:.06em}
#livebadge{
  position:fixed;top:14px;right:14px;z-index:40;
  display:flex;align-items:center;gap:.45em;
  background:rgba(20,14,10,.8);border:1px solid rgba(127,191,138,.5);
  border-radius:999px;padding:.32em .9em;font-size:.78rem;font-weight:700;
  color:var(--ok);letter-spacing:.05em;backdrop-filter:blur(6px);
}
#livebadge .dot{width:.55em;height:.55em;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#livebadge.paused{color:var(--gold);border-color:rgba(201,162,75,.5)}
#livebadge.paused .dot{background:var(--gold);animation:none}
#rejoin{
  position:fixed;top:52px;right:14px;z-index:40;display:none;
  background:var(--gold);color:#241a0d;border:none;border-radius:999px;
  padding:.5em 1.1em;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
#presenterlink{
  position:fixed;top:14px;left:14px;z-index:40;
  background:none;border:none;color:rgba(244,237,224,.3);
  font-family:inherit;font-size:.72rem;letter-spacing:.08em;cursor:pointer;padding:.3em .5em;
}
#respbtn{display:none}

/* ------- response form ------- */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:.6em 0 1em}
.chip{
  background:var(--card);border:1.5px solid rgba(244,237,224,.25);color:var(--ivory);
  border-radius:999px;padding:.5em 1.05em;font-family:inherit;font-size:.92em;font-weight:600;
  cursor:pointer;transition:all .15s;
}
.chip.on{background:rgba(91,143,217,.25);border-color:var(--glass-blue);color:#cfe0f7}
label.f{display:block;font-size:.8em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ivory-dim);margin:1em 0 .3em}
input[type=text],textarea{
  width:100%;background:var(--walnut-2);border:1.5px solid rgba(244,237,224,.25);
  border-radius:10px;color:var(--ivory);font-family:inherit;font-size:1em;padding:.65em .8em;
}
input:focus,textarea:focus{outline:2px solid var(--glass-blue);border-color:transparent}
#submitresp{width:100%;margin-top:1.2em;font-size:1.05rem;padding:.85em}
.thanks{text-align:center;padding-top:12vh}
.thanks .big{font-size:3.2rem;margin-bottom:.2em}

/* ------- modal ------- */
#modal{
  position:fixed;inset:0;background:rgba(15,10,7,.9);z-index:60;display:none;
  align-items:center;justify-content:center;padding:18px;
}
#modal.open{display:flex}
#modalbox{
  background:var(--walnut-2);border:1px solid rgba(201,162,75,.35);border-radius:16px;
  width:min(720px,100%);max-height:85dvh;overflow-y:auto;padding:1.3em 1.3em 1.6em;
}
#modalbox h3{font-family:'Fraunces',serif;font-size:1.5rem;margin-bottom:.6em;color:var(--gold)}
.respitem{border-bottom:1px solid rgba(244,237,224,.12);padding:.7em 0}
.respitem b{color:var(--gold)}
.respitem .meta{font-size:.8em;color:var(--ivory-dim)}
.modalclose{float:right;background:none;border:none;color:var(--ivory-dim);font-size:1.6rem;cursor:pointer;line-height:1}
.titlebg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.titlebg img{width:100%;height:100%;object-fit:cover;opacity:.22;filter:saturate(.85)}
.titlebg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,21,16,.35),rgba(29,21,16,.92) 78%)}
@media (prefers-reduced-motion: reduce){.slide{transition:none}#livebadge .dot{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div class="glassbar"></div>
  <div id="viewport"></div>
</div>

<button id="presenterlink">presenter</button>
<div id="livebadge"><span class="dot"></span><span id="livetext">FOLLOWING LIVE</span></div>
<button id="rejoin">↻ Rejoin live</button>

<div id="chrome">
  <button class="navbtn" id="prev">‹ Back</button>
  <span id="counter"></span>
  <button class="navbtn" id="respbtn">Responses</button>
  <button class="navbtn primary" id="next">Next ›</button>
</div>

<div id="pinmodal" style="position:fixed;inset:0;background:rgba(15,10,7,.92);z-index:70;display:none;align-items:center;justify-content:center;padding:18px">
  <div style="background:var(--walnut-2);border:1px solid rgba(201,162,75,.4);border-radius:16px;padding:1.5em;width:min(340px,100%);text-align:center">
    <h3 style="font-family:'Fraunces',serif;color:var(--gold);font-size:1.3rem;margin-bottom:.8em">Presenter access</h3>
    <input type="tel" id="pininput" inputmode="numeric" maxlength="8" placeholder="Enter PIN" autocomplete="off"
      style="text-align:center;font-size:1.4rem;letter-spacing:.35em;font-weight:700">
    <div id="pinerr" style="color:var(--glass-red);font-size:.85rem;font-weight:600;margin-top:.5em;min-height:1.2em"></div>
    <div style="display:flex;gap:10px;margin-top:.8em">
      <button class="navbtn" style="flex:1" id="pincancel">Cancel</button>
      <button class="navbtn primary" style="flex:1" id="pingo">Unlock</button>
    </div>
  </div>
</div>

<div id="modal"><div id="modalbox">
  <button class="modalclose" onclick="document.getElementById('modal').classList.remove('open')">×</button>
  <h3>Responses</h3>
  <div id="resplist">Loading…</div>
  <button class="navbtn" style="margin-top:1em" id="copyresp">Copy all</button>
</div></div>

`<div class="inner">
  <div class="eyebrow">Why we're here tonight</div>
  <h2>Building on what this team has already built</h2>
  <p class="sub">This church already has real equipment and real talent — that's the Dream Team. This proposal is about taking what's here and making it <b style="color:var(--gold)">excellent, efficient, and easier to run</b>, so the message goes out with nothing in its way.</p>
  <ul class="points">
    <li><b>Excellence in worship</b> — a sanctuary and platform that reflect the God we serve</li>
    <li><b>Reach beyond these walls</b> — a live stream people actually stay and watch</li>
    <li><b>Room for more hands</b> — every upgrade creates a place for someone to serve</li>
  </ul>
  <p class="sub" style="font-size:.9em">Three priorities, in order — plus a look further down the road.</p>
</div>`,

/* ============ STATE ============ */
let cur = 0, isPresenter = false, following = true, lastSeenLive = 0, submitted = false;

const vp = document.getElementById('viewport');
slides.forEach((h,i)=>{
  const d=document.createElement('div');
  d.className='slide'; d.dataset.i=i; d.innerHTML=h;
  vp.appendChild(d);
});

function show(i, manual){
  i = Math.max(0, Math.min(slides.length-1, i));
  if(manual && !isPresenter && i!==lastSeenLive){ following=false; }
  if(manual && !isPresenter && i===lastSeenLive){ following=true; }
  document.querySelectorAll('.slide').forEach(s=>{
    const idx=+s.dataset.i;
    s.classList.toggle('active', idx===i);
    s.classList.toggle('exit-left', idx<i);
  });
  cur=i;
  document.getElementById('counter').textContent=(i+1)+' / '+slides.length;
  document.getElementById('prev').disabled = i===0;
  document.getElementById('next').disabled = i===slides.length-1;
  updateBadge();
  if(isPresenter) pushLive();
}

function updateBadge(){
  const b=document.getElementById('livebadge'), t=document.getElementById('livetext'), r=document.getElementById('rejoin');
  if(isPresenter){ b.classList.remove('paused'); t.textContent='PRESENTING LIVE'; r.style.display='none'; return; }
  if(following){ b.classList.remove('paused'); t.textContent='FOLLOWING LIVE'; r.style.display='none'; }
  else{ b.classList.add('paused'); t.textContent='BROWSING'; r.style.display='block'; }
}

/* ============ SYNC ============ */
async function pushLive(){
  try{ await window.storage.set('live-state', JSON.stringify({slide:cur, t:Date.now()}), true); }
  catch(e){ console.error('push failed', e); }
}
async function poll(){
  if(isPresenter) return;
  try{
    const r = await window.storage.get('live-state', true);
    if(r && r.value){
      const s = JSON.parse(r.value);
      lastSeenLive = s.slide;
      if(following && s.slide !== cur) show(s.slide, false);
      else updateBadge();
    }
  }catch(e){ /* no live state yet */ }
}
setInterval(poll, POLL_MS);
poll();

document.getElementById('rejoin').onclick = ()=>{ following=true; show(lastSeenLive,false); };

/* ============ NAV ============ */
document.getElementById('next').onclick = ()=>show(cur+1,true);
document.getElementById('prev').onclick = ()=>show(cur-1,true);
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); show(cur+1,true); }
  if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); show(cur-1,true); }
});
let tx=null,ty=null;
vp.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
vp.addEventListener('touchend',e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ show(cur+(dx<0?1:-1),true); }
  tx=null;
},{passive:true});

/* ============ PRESENTER ============ */
const pinmodal=document.getElementById('pinmodal'), pininput=document.getElementById('pininput'), pinerr=document.getElementById('pinerr');
document.getElementById('presenterlink').onclick=()=>{
  if(isPresenter) return;
  pinerr.textContent=''; pininput.value='';
  pinmodal.style.display='flex';
  setTimeout(()=>pininput.focus(),50);
};
document.getElementById('pincancel').onclick=()=>{ pinmodal.style.display='none'; };
function tryUnlock(){
  if(pininput.value.trim()===PIN){
    pinmodal.style.display='none';
    isPresenter=true; following=false;
    document.getElementById('respbtn').style.display='inline-block';
    document.getElementById('presenterlink').textContent='presenting ✓';
    updateBadge(); pushLive();
  } else {
    pinerr.textContent='Incorrect PIN — try again';
    pininput.value=''; pininput.focus();
  }
}
document.getElementById('pingo').onclick=tryUnlock;
pininput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); tryUnlock(); } });

/* ============ RESPONSES ============ */
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  const wrap=c.parentElement;
  if(c.dataset.solo){                                  /* opt-out: clears all others */
    const wasOn=c.classList.contains('on');
    wrap.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    if(!wasOn) c.classList.add('on');
  } else {                                             /* any ministry area clears the opt-out */
    wrap.querySelectorAll('.chip[data-solo]').forEach(x=>x.classList.remove('on'));
    c.classList.toggle('on');
  }
});
document.addEventListener('click', async e=>{
  if(e.target.id!=='submitresp') return;
  if(submitted) return;
  const name=document.getElementById('rname').value.trim();
  const contact=document.getElementById('rcontact').value.trim();
  const noteEl=document.getElementById('formnote')||(function(){const d=document.createElement('div');d.id='formnote';d.style.cssText='color:var(--glass-red);font-weight:700;margin-top:.7em;text-align:center';document.getElementById('submitresp').before(d);return d;})();
  if(!name){ noteEl.textContent='Please add your name so Pastor Josh can follow up.'; document.getElementById('rname').focus(); return; }
  noteEl.textContent='';
  const interests=[...document.querySelectorAll('#interests .chip.on')].map(c=>c.dataset.v);
  const msg=document.getElementById('rmsg').value.trim();
  e.target.textContent='Sending…'; e.target.disabled=true;
  try{
    const id='resp:'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
    await window.storage.set(id, JSON.stringify({name,contact,interests,msg,time:new Date().toLocaleString()}), true);
    submitted=true;
    document.getElementById('formwrap').innerHTML=
      `<div class="thanks"><div class="big">🙏</div><h2>Thank you, ${name.split(' ')[0]}!</h2>
       <p class="sub" style="margin:0 auto">Your response is in. Pastor Josh will follow up with you personally.</p></div>`;
  }catch(err){
    noteEl.textContent='Could not send — check your connection and try again.';
    e.target.textContent='Send my response'; e.target.disabled=false;
  }
});

document.getElementById('respbtn').onclick=async ()=>{
  document.getElementById('modal').classList.add('open');
  const list=document.getElementById('resplist'); list.textContent='Loading…';
  try{
    const idx=await window.storage.list('resp:', true);
    const keys=(idx&&idx.keys)?idx.keys:[];
    if(!keys.length){ list.innerHTML='<i>No responses yet.</i>'; return; }
    const items=[];
    for(const k of keys){
      try{ const r=await window.storage.get(k.key||k, true); if(r&&r.value) items.push(JSON.parse(r.value)); }catch(e){}
    }
    items.sort((a,b)=>(b.time||'').localeCompare(a.time||''));
    window._respText = items.map(r=>`${r.name} — ${r.contact}\n  Interests: ${(r.interests||[]).join(', ')||'—'}\n  Note: ${r.msg||'—'}\n  ${r.time}`).join('\n\n');
    list.innerHTML=items.map(r=>
      `<div class="respitem"><b>${r.name}</b> · ${r.contact||'no contact given'}<br>
       ${(r.interests||[]).join(' · ')}
       ${r.msg?`<br><i>"${r.msg}"</i>`:''}
       <div class="meta">${r.time||''}</div></div>`).join('');
  }catch(e){ list.innerHTML='<i>No responses yet.</i>'; }
};
document.getElementById('copyresp').onclick=async function(){
  try{ await navigator.clipboard.writeText(window._respText||''); this.textContent='Copied ✓'; setTimeout(()=>this.textContent='Copy all',1500);}catch(e){}
};

show(0,false);

/* ---- self-generating QR of this page's own address ---- */
(function(){
  if(!/^https?:/.test(location.protocol)) return;      // no QR when opened as a local file
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload=function(){
    try{
      new QRCode(document.getElementById('qrbox'),{
        text:location.href.split('#')[0], width:168, height:168,
        colorDark:'#241a0d', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M
      });
      document.getElementById('qrblock').style.display='block';
    }catch(e){}
  };
  document.head.appendChild(s);
})();
</script>
